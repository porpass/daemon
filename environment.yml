# Conda environment for the PORPASS processing daemon (porpass-daemon).
#
# This provisions only the interpreter + runtime dependencies. Installing the
# daemon itself and GRaSP are SEPARATE, explicit steps, run by the user that owns
# the conda installation (not the service account):
#
#   conda env create -f environment.yml
#   conda run -n porpass-daemon pip install -e /abs/path/to/daemon/checkout
#   conda run -n porpass-daemon pip install "grasp @ git+https://github.com/porpass/grasp@<tag>"
#
# See deploy/README.md for the full prod install and the pinned-GRaSP tag.
name: porpass-daemon
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pymysql>=1.1
  - requests>=2.31
  - python-dotenv>=1.0
